services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-textile_db}
      POSTGRES_USER: ${POSTGRES_USER:-textile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.aws-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-textile} -d ${POSTGRES_DB:-textile_db}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_SSLMODE: disable
      DATABASE_URL: postgresql://${POSTGRES_USER:-textile}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-textile_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.aws-demo}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.aws-demo}
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
      STORAGE_BACKEND: local
      UPLOAD_DIR: static/uploads
    volumes:
      - uploads:/app/static
      - ./ml/artifacts:/ml/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1
    environment:
      APP_ENV: production
      DB_SSLMODE: disable
      DATABASE_URL: postgresql://${POSTGRES_USER:-textile}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-textile_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.aws-demo}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.aws-demo}
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
      STORAGE_BACKEND: local
      UPLOAD_DIR: static/uploads
    volumes:
      - uploads:/app/static
      - ./ml/artifacts:/ml/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_API_URL: /
    restart: unless-stopped
    volumes:
      - ./docker/nginx.aws-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  uploads:
